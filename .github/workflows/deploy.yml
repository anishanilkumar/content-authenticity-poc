name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: 77.90.40.64
          username: anish
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/anish/signing-poc
            git pull origin main
            /home/anish/.venv/signing-poc/bin/pip install -r backend/requirements.txt --quiet
            # Use the same DATABASE_URL the service runs with (set via systemd
            # Environment= in the NixOS config) so the migration hits the right DB.
            DATABASE_URL=$(systemctl show signing-poc-backend -p Environment --value \
              | tr ' ' '\n' | sed -n 's/^DATABASE_URL=//p')
            if [ -z "$DATABASE_URL" ]; then
              echo "ERROR: could not read DATABASE_URL from signing-poc-backend unit" >&2
              exit 1
            fi
            export DATABASE_URL
            # Apply DB migrations with Alembic (no-op when already at head).
            /home/anish/.venv/signing-poc/bin/alembic upgrade head
            sudo systemctl restart signing-poc-backend
