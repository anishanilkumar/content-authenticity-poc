# Alembic configuration. Run from the repo root, e.g.:
#   alembic upgrade head
# The database URL is NOT set here — env.py pulls it from the app (database.py /
# the DATABASE_URL env var) so migrations always target the same DB as the service.

[alembic]
# Migration scripts live alongside the backend package.
script_location = backend/alembic

# Put backend/ on sys.path so env.py can `import database` and `import models`.
prepend_sys_path = backend

# Separator used when joining multiple version_locations (we only have one).
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
